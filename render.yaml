# Render Blueprint: one Docker web service. The PostgreSQL database already exists on Render (PostGIS is available there),
# so it is not declared here; enter its Internal Database URL as DATABASE_URL in the dashboard (never commit it).
# Check the plan name against Render's current pricing before applying.
# Keep the service at a single instance: caches and rate limits live in the API's memory.
services:
  - type: web
    name: routepoi
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    plan: starter
    numInstances: 1
    healthCheckPath: /healthz
    envVars:
      # Internal Database URL of the existing Render database (postgresql://user:password@host/db).
      - key: DATABASE_URL
        sync: false
      - key: Suunto__Mode
        value: Live
      - key: Suunto__ClientId
        sync: false
      - key: Suunto__ClientSecret
        sync: false
      - key: Suunto__SubscriptionKey
        sync: false
      - key: Google__ClientId
        sync: false
      - key: Google__ClientSecret
        sync: false
      # Optional sign-in restrictions (comma-separated); leave empty to allow any account.
      - key: Auth__AllowedGoogleEmails
        sync: false
      - key: Auth__AllowedSuuntoUsernames
        sync: false
      # Render terminates TLS and is the only way in, so trust its forwarded headers.
      - key: Hosting__ForwardedHeaders
        value: "true"
      - key: Hosting__Hsts
        value: "true"
      # With a custom domain, also set App__PublicBaseUrl and Suunto__RedirectUri to https://your-domain...
